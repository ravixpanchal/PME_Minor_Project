[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pme-database-layer"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.7,<3",
    "SQLAlchemy>=2,<3",
    "PyMySQL>=1.1,<2",
    "python-dotenv>=1.2.3",
    "streamlit>=1.40,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
