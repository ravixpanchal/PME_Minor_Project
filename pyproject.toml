[project]
name = "medical-report-extraction"
version = "0.1.0"
description = "Foundation pipeline for digitizing medical examination reports"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pymupdf>=1.23.0",
    "SQLAlchemy>=2,<3",
    "PyMySQL>=1.1,<2",
    "python-dotenv>=1.2.3",
    "opencv-python>=4.8.0",
    "pillow>=10.0.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "numpy>=1.24.0",
    "openpyxl>=3.1.0",
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
    "streamlit>=1.50.0",
    "psycopg2-binary>=2.9.0",
]

[project.scripts]
run-pipeline = "src.run_pipeline:main"
pme-pipeline = "pipelines.run_all:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src", "pipelines"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"

[project.optional-dependencies]
vlm = [
    "torch>=2.4.0",
    "torchvision>=0.19.0",
    "transformers>=4.49.0,<5",   # first version with Qwen2.5-VL support
    "accelerate>=1.0.0",
]